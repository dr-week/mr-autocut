[project]
name = "mr-autocut-backend"
version = "0.2.0"
description = "MR-AutoCut engine: sequence-adaptive auto-cut, multi-track reel builder, AI Director, and FilmCraft CLI bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mr_autocut"]
