name: CI — Backend & Zuari Frontend

on:
  push:
    branches: ["main", "feat/mr-autocut-mvp"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install filmcraft-cli v0.20.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"; tmp=$(mktemp -d)
          gh release download v0.20.1 -R storytold/filmcraft -p filmcraft-0.20.1-linux-x86_64.tar.gz -D "$tmp" --clobber \
            || curl -fsSL -o "$tmp/filmcraft-0.20.1-linux-x86_64.tar.gz" https://github.com/storytold/filmcraft/releases/download/v0.20.1/filmcraft-0.20.1-linux-x86_64.tar.gz \
            || { echo "filmcraft-cli unavailable; dependent tests will skip"; exit 0; }
          tar -xzf "$tmp"/filmcraft-0.20.1-linux-x86_64.tar.gz -C "$tmp"
          cp -f "$(find "$tmp" -type f -name filmcraft-cli | head -n 1)" "$HOME/.local/bin/filmcraft-cli"
          chmod +x "$HOME/.local/bin/filmcraft-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/filmcraft-cli" --version || true
      - uses: astral-sh/setup-uv@v4
      - name: Backend Pytest
        working-directory: backend
        run: uv sync --extra dev && uv run pytest -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend Build
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: Micro-Modular LOC Guard
        run: python3 scripts/check_loc.py
